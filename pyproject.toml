[project]
name = "tidy-one"
version = "0.1.0"
description = "One tidy, private index of your files, notes and cloud work — searchable by every AI agent you use."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "sqlite-vec>=0.1.6",
  "kiwipiepy>=0.20",
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "huggingface-hub>=0.25",
  "mcp>=1.12",
]

[project.optional-dependencies]
# Device agent: extraction of documents (and later photos, video, cloud sources)
agent = [
  "markitdown[pdf,docx,pptx,xlsx]>=0.1",
  "pypdf>=4",
  "olefile>=0.47",
]
# One-off model export (KURE-v1 -> ONNX fp32 + int8). Heavy: pulls torch.
export = [
  "optimum[onnxruntime]>=1.23",
  "sentence-transformers>=3",
]
dev = ["pytest>=8"]

[project.scripts]
tidy = "tidy_one.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidy_one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
